<!DOCTYPE html>
<html lang="nl">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Interactieve Koelkast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">

    <main class="home-content">
        <h1>Mijn Interactieve Koelkast</h1>

        <div class="fridge-container">
            <img id="fridge" src="koelkast_gesloten.png" alt="Koelkast">

            <div id="shelves" class="shelf">
                <img id="apple" src="appel.png" alt="Appel" onclick="openProduct('appel')">
                <img id="yoghurt" src="magere_yoghurt.jpg" alt="Magere Yoghurt" onclick="openProduct('yoghurt')">
                <img id="melk" src="melk.png" alt="Melk" onclick="openProduct('melk')">
                <img id="zalm" src="zalm.png" alt="Zalm" onclick="openProduct('zalm')">
                <img id="gehakt" src="gehakt.png" alt="Gehakt" onclick="openProduct('gehakt')">
            </div>
        </div>
    </main>

    <!-- Belangrijk: script onderaan + defer als je het in <head> zou zetten -->
    <script src="script.js"></script>
</body>
<body class="product-page yoghurt-page">
</html>
